name: Notify Pages repo

on:
  push:
    branches: [master]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to ufrutov.github.io
        env:
          TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ufrutov/ufrutov.github.io/dispatches \
            -d '{"event_type":"readme-updated"}'
